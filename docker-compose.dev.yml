# WebSync Development Docker Compose
# For local development with hot reloading

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend
    container_name: websync-backend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - AUTH_PASSWORD=admin
      - JWT_SECRET=dev-secret
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    container_name: websync-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:3000
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
